-auto max-w-[520px] px-4 pt-6 pb-32 stack"><div class="flex gap-2"><div class="h-1 flex-1 rounded-full bg-primary"></div><div class="h-1 flex-1 rounded-full bg-primary"></div><div class="h-1 flex-1 rounded-full bg-muted"></div></div><div><p class="text-sm font-medium text-primary">三步建档 · 2 / 3</p><h1 class="mt-1 text-2xl font-semibold tracking-tight">和店小谋聊聊生意</h1></div><section class="rounded-2xl border border-border bg-card p-4 "><p class="text-sm">1　最近生意，最头疼的是哪件？</p><div class="mt-2"><span class="inline-block rounded-full border border-border px-3 py-1 text-sm bg-background" style="margin:0 6px 6px 0">客人少了</span><span class="inline-block rounded-full border border-border px-3 py-1 text-sm bg-background" style="margin:0 6px 6px 0">忙的时候接不住</span><span class="inline-block rounded-full border border-border px-3 py-1 text-sm bg-background" style="margin:0 6px 6px 0">老客不怎么来了</span><span class="inline-block rounded-full border border-border px-3 py-1 text-sm bg-primary text-primary-foreground" style="margin:0 6px 6px 0">卖得不少，就是不赚钱</span><span class="inline-block rounded-full border border-border px-3 py-1 text-sm bg-background" style="margin:0 6px 6px 0">以上都不是，我自己说</span></div></section><section class="rounded-2xl border border-border bg-card p-4 "><p class="text-sm">2　卖得最多的双人餐，你觉得是？</p><div class="mt-2"><span class="inline-block rounded-full border border-border px-3 py-1 text-sm bg-background" style="margin:0 6px 6px 0">还能赚一点</span><span class="inline-block rounded-full border border-border px-3 py-1 text-sm bg-background" style="margin:0 6px 6px 0">差不多保本</span><span class="inline-block rounded-full border border-border px-3 py-1 text-sm bg-primary text-primary-foreground" style="margin:0 6px 6px 0">好像在亏</span><span class="inline-block rounded-full border border-border px-3 py-1 text-sm bg-background" style="margin:0 6px 6px 0">不清楚</span><span class="inline-block rounded-full border border-border px-3 py-1 text-sm bg-background" style="margin:0 6px 6px 0">我自己说</span></
